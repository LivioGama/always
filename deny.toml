# cargo-deny config — supply-chain gate.
#
# Run locally with `cargo deny check`; CI runs the same.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
    # Transitive through keyring 2.3's Linux secret-service stack.
    # Revisit when migrating keyring storage; keyring 4 removes these but
    # currently expands the dependency graph enough to break local-stt builds.
    "RUSTSEC-2024-0384", # instant unmaintained
    "RUSTSEC-2024-0388", # derivative unmaintained
]

[licenses]
# Allow only OSI-approved permissive + LGPL-2.1+ (transitive). Reject GPL
# (would force the daemon copyleft).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/cjpais/vad-rs"]
