# cargo-deny config — supply-chain gate.
#
# Run locally with `cargo deny check`; CI runs the same.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
# Allow only OSI-approved permissive + LGPL-2.1+ (transitive). Reject GPL
# (would force the daemon copyleft).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "CC0-1.0",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl", reason = "Use rustls via reqwest's default-tls feature." },
    { name = "openssl-sys", reason = "Use rustls via reqwest's default-tls feature." },
]
# `rdev` is unmaintained (last release ~2022); the keyboard listener is
# slated for migration to a native CGEventTap implementation. Until the
# migration lands the dep stays in tree but is logged as a warning so
# every CI run reminds us to finish it.
warn = [
    { name = "rdev", reason = "Unmaintained — migrate to native CGEventTap (tracked in P2.2)." },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
