# cargo-deny config — supply-chain gate.
#
# Run locally with `cargo deny check`; CI runs the same.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
ignore = [
    # Low-risk advisory vulnerabilities in widely-used infra crates.
    # These are advisory-level issues with minimal attack surface for our usage.
    "RUSTSEC-2024-0436", # paste unmaintained
    # Advisory/vulnerability advisories that are low-risk for our usage.
    "RUSTSEC-2026-0258", # h2 — unbounded empty DATA frames
]

[licenses]
# Allow only OSI-approved permissive licenses for dependencies. The daemon
# itself is AGPL-3.0 (copyleft); deps must remain permissive so they don't
# impose stricter copyleft terms on the combined work.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Unlicense",
    "AGPL-3.0-only",
]
confidence-threshold = 0.93
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/cjpais/vad-rs"]
