[package]
name = "always"
version = "0.0.1"
edition = "2024"
description = "Always-on voice activation daemon — Groq STT with intelligent transcription"
license = "Apache-2.0"
repository = "https://github.com/rtk-ai/always"
keywords = ["stt", "voice", "speech", "cli", "groq"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "always"
path = "src/main.rs"

[[bin]]
name = "always-overlay"
path = "src/overlay/main.rs"
required-features = ["overlay"]

[features]
# `macos` is the default — full GUI overlay + clipboard paste + global
# keyboard shortcuts. `linux` and `windows` build the daemon CLI only;
# audio capture, paste, and key listener implementations are stubs that
# return `NotImplemented`. The split lets CI build for Linux/Windows
# without dragging in `core-graphics` or `oslog`.
default = ["macos"]
macos = ["dep:core-graphics", "dep:oslog", "dep:rdev"]
linux = []
windows = []
# Linux overlay UI with X11 renderer.
overlay = ["dep:x11", "x11/xlib"]
# Opt-in offline transcription via `transcribe-rs`. On macOS we pin to
# the same `whisper-metal + onnx` build Handy ships (`transcribe-rs
# 0.3.3`) — it builds clean under Xcode 16 / macOS 26 where the generic
# `whisper-cpp` feature fails. On other targets we fall back to
# `whisper-cpp + onnx`. The `onnx` feature unlocks Parakeet, Moonshine,
# Canary, SenseVoice, GigaAM, and Cohere engines via ONNX Runtime.
# Enable locally with `cargo build --features local-stt`.
local-stt = ["dep:transcribe-rs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart", "stream"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
# Silero VAD. Same crate Handy ships — git fork by cjpais, pinned to
# ort 2.0.0-rc.12 so it coexists with `transcribe-rs >= 0.3.3` (which
# also pins rc.12). `default-features = false` drops the `helpers`
# feature (ebur128 + samplerate) that we don't need. The Silero ONNX
# model file is bundled at `resources/models/silero_vad_v4.onnx` and
# loaded via `include_bytes!` at runtime — see `always::vad_silero`.
vad-rs = { version = "0.1.6", git = "https://github.com/cjpais/vad-rs", default-features = false }
regex = "1"
strsim = "0.11"
parking_lot = "0.12"
thiserror = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
keyring = "4.1"
humantime = "2"
libc = "0.2"
# Linux overlay UI dependency.
x11 = { version = "2.21", optional = true }
# Local-model registry support (ports Handy's downloader). `sha2`/`tar`/`flate2`
# for verify+extract, `futures-util` for streaming download bodies.
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
futures-util = "0.3"
# Optional, gated by the `macos` feature.
core-graphics = { version = "0.24", optional = true }
rdev = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `oslog` is target-gated AND feature-gated so a future macOS user can
# still build with `--no-default-features` for a pure-CLI daemon.
oslog = { version = "0.2", optional = true }
# macOS: same build flags as Handy 0.8.3 — Metal-accelerated whisper +
# ONNX Runtime for the non-whisper engines. Pinned to 0.3.3 for parity.
transcribe-rs = { version = "=0.3.8", features = ["whisper-metal", "onnx"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Non-macOS targets: generic whisper-cpp build + ONNX. The macOS 26
# build-break note in the comment above does not apply on Linux.
transcribe-rs = { version = "=0.3.8", features = ["whisper-cpp", "onnx"], optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = "0.5"

[[bench]]
name = "vad"
harness = false

[[bench]]
name = "speech_action"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
