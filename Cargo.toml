[package]
name = "always"
version = "0.13.0"
edition = "2024"
description = "Always-on voice activation daemon — Groq STT with intelligent transcription"
license = "Apache-2.0"
repository = "https://github.com/rtk-ai/always"
keywords = ["stt", "voice", "speech", "cli", "groq"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "always"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
chrono = { version = "0.4", features = ["clock"] }
webrtc-vad = "0.4"
toml = "0.8"
regex = "1"
base64 = "0.22"
rdev = "0.5"
once_cell = "1.19"
whisper-rs = "0.12"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
