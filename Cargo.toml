[package]
name = "always"
version = "0.13.0"
edition = "2024"
description = "Always-on voice activation daemon — Groq STT with intelligent transcription"
license = "Apache-2.0"
repository = "https://github.com/rtk-ai/always"
keywords = ["stt", "voice", "speech", "cli", "groq"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "always"
path = "src/main.rs"

[features]
# `macos` is the default — full GUI overlay + clipboard paste + global
# keyboard shortcuts. `linux` and `windows` build the daemon CLI only;
# audio capture, paste, and key listener implementations are stubs that
# return `NotImplemented`. The split lets CI build for Linux/Windows
# without dragging in `core-graphics` or `oslog`.
default = ["macos"]
macos = ["dep:core-graphics", "dep:oslog", "dep:rdev"]
linux = []
windows = []

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
voice_activity_detector = "0.2.1"
toml = "0.8"
regex = "1"
base64 = "0.22"
strsim = "0.11"
parking_lot = "0.12"
thiserror = "1"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
keyring = "2.3"
humantime = "2"
# Optional, gated by the `macos` feature.
core-graphics = { version = "0.24", optional = true }
rdev = { version = "0.5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# `oslog` is target-gated AND feature-gated so a future macOS user can
# still build with `--no-default-features` for a pure-CLI daemon.
oslog = { version = "0.2", optional = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["full", "test-util"] }
criterion = "0.5"

[[bench]]
name = "vad"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
