[package]
name = "always"
version = "0.13.0"
edition = "2024"
description = "Always-on voice activation daemon — Groq STT with intelligent transcription"
license = "Apache-2.0"
repository = "https://github.com/rtk-ai/always"
keywords = ["stt", "voice", "speech", "cli", "groq"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "always"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
reqwest = { version = "0.12", features = ["json", "blocking", "multipart"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
voice_activity_detector = "0.2.1"
toml = "0.8"
regex = "1"
base64 = "0.22"
core-graphics = "0.24"
rdev = "0.5"
strsim = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"
keyring = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
oslog = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
