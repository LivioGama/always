[package]
name = "always-tauri"
version = "0.1.1"
edition = "2021"
description = "Tauri v2 frontend for the Always speech-to-text daemon"
license = "AGPL-3.0-only"

[lib]
name = "always_tauri"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "always-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri v2 (stable)
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }

# Note: tauri-plugin-autostart and tauri-plugin-updater are in 3.x alpha for
# the Tauri v2 ecosystem.  The stable 2.x releases are for Tauri v1 only.
# Uncomment when the plugins reach stable release.
# tauri-plugin-autostart = { version = "3.0.0-alpha.2" }
# tauri-plugin-updater   = { version = "3.0.0-alpha.2" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Tray title (libayatana-appindicator reads the GLib application name). Same
# vendored glib the [patch] below pins - already in the dependency tree.
[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"

[patch.crates-io]
glib = { path = "../../vendor/glib-0.18.5" }
