version: 2

updates:
  # ── Rust ────────────────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"
      include: "scope"
    groups:
      tokio-stack:
        patterns:
          - "tokio*"
      tracing-stack:
        patterns:
          - "tracing*"
      reqwest-stack:
        patterns:
          - "reqwest*"
      serde-stack:
        patterns:
          - "serde*"
      # Catch-all, listed last: a dependency joins the FIRST group it matches,
      # so the named stacks above keep priority. Majors stay separate PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── npm (Tauri GUI) ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/always-gui"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gui"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      react-stack:
        patterns:
          - "react*"
          - "@types/react*"
      tauri-stack:
        patterns:
          - "@tauri-apps*"
      vite-stack:
        patterns:
          - "vite*"
          - "@vitejs*"
      # Catch-all, listed last (first matching group wins). Majors stay separate.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    groups:
      # Majors stay separate PRs.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
