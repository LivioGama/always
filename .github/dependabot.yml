version: 2

updates:
  # ── Rust ────────────────────────────────────────────────────────────────────
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps(cargo)"
      include: "scope"
    groups:
      tokio-stack:
        patterns:
          - "tokio*"
      tracing-stack:
        patterns:
          - "tracing*"
      reqwest-stack:
        patterns:
          - "reqwest*"
      serde-stack:
        patterns:
          - "serde*"

  # ── npm (Tauri GUI) ────────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/always-gui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "gui"
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      react-stack:
        patterns:
          - "react*"
          - "@types/react*"
      tauri-stack:
        patterns:
          - "@tauri-apps*"
      vite-stack:
        patterns:
          - "vite*"
          - "@vitejs*"

  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"

  # ── Swift (Always app) ─────────────────────────────────────────────────────
  - package-ecosystem: "swift"
    directory: "/Always"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Zurich"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "swift"
    commit-message:
      prefix: "deps(spm)"
      include: "scope"