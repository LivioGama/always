name: pr-gate guard

# PR-Gate is opt-in. It signs each PR body it opens with
# `<!-- pr-gate:v1 sig=<hmac> -->`; this workflow recomputes the signature with
# the PR_GATE_HMAC secret and closes opted-in PRs that lack a valid signature.
# PRs without a pr-gate:v1 marker are ordinary GitHub PRs and are left alone.
# Contract: HMAC-SHA256(PR_GATE_HMAC, "<owner/name>#<head branch>").
#
# SECURITY: `pull_request_target` runs with a write token in the context of the
# base branch. This workflow therefore NEVER checks out or executes PR code, and
# never interpolates PR-controlled text (title, body, branch name) into the
# script: everything reaches the script through `env:` only.
#
# Logic is inline (no checkout); .github/scripts/test-pr-gate-guard.sh extracts
# the `run:` block below and exercises it against a stubbed `gh`.

on:
  pull_request_target:
    types: [opened, reopened, edited, labeled, unlabeled]

concurrency:
  group: pr-gate-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  issues: write

jobs:
  guard:
    name: pr-gate signature
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify pr-gate signature
        env:
          GH_TOKEN: ${{ github.token }}
          PR_GATE_HMAC: ${{ secrets.PR_GATE_HMAC }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          marker='<!-- pr-gate-guard -->'

          # Events may be queued out of order; evaluate the current PR, not the event.
          current_pr="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          PR_STATE="$(jq -r '.state' <<< "${current_pr}")"
          PR_BODY="$(jq -r '.body // ""' <<< "${current_pr}")"
          LABELS_JSON="$(jq -c '[.labels[].name]' <<< "${current_pr}")"

          if [ "${PR_STATE}" != "open" ]; then
            echo "PR #${PR_NUMBER} is ${PR_STATE}; nothing to do."; exit 0
          fi
          if [ "${HEAD_REPO}" != "${BASE_REPO}" ]; then
            echo "Fork PR (${HEAD_REPO}); external contributions are not gated."; exit 0
          fi
          if [ "${AUTHOR_TYPE}" = "Bot" ]; then
            echo "Bot author; not gated."; exit 0
          fi
          if [[ "${HEAD_REF}" =~ ^release- && "${BASE_REF}" == "main" ]]; then
            echo "Release PR (${HEAD_REF} -> main); exempt."; exit 0
          fi
          if printf '%s' "${LABELS_JSON}" | jq -e 'index("pr-gate-bypass")' >/dev/null; then
            echo "Label pr-gate-bypass present; not gated."; exit 0
          fi
          if ! printf '%s' "${PR_BODY}" | grep -qE '<!--[[:space:]]*pr-gate:v1([[:space:]]|-->)'; then
            echo "No pr-gate:v1 marker; PR was not opted into PR-Gate."; exit 0
          fi
          if [ -z "${PR_GATE_HMAC}" ]; then
            echo "::warning::PR_GATE_HMAC secret is empty; failing open (PR not checked)."; exit 0
          fi

          want="$(printf '%s' "${REPO}#${HEAD_REF}" | openssl dgst -sha256 -hmac "${PR_GATE_HMAC}" | awk '{print $NF}')"
          got="$(printf '%s' "${PR_BODY}" | grep -oE '<!-- pr-gate:v1 sig=[0-9a-f]{64} -->' | head -n1 | sed -E 's/.*sig=([0-9a-f]{64}).*/\1/' || true)"

          if [ -n "${got}" ] && [ "${got}" = "${want}" ]; then
            echo "Valid pr-gate signature."; exit 0
          fi

          echo "::error::PR #${PR_NUMBER} has an invalid pr-gate signature."

          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate --jq '.[].body' || true)"
          if ! printf '%s' "${existing}" | grep -qF "${marker}"; then
            gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body "${marker}
          This PR opted into pr-gate but its signature is invalid. Resubmit with \`pr-gate submit\`; maintainers can add the \`pr-gate-bypass\` label and reopen to override."
          fi
          gh pr close "${PR_NUMBER}" --repo "${REPO}"
          exit 1
