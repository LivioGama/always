name: Release

# Release model (same shape as the Pixel project's, adapted for this repo's
# develop -> main branching; see .agents/skills/release/SKILL.md):
#
#   tag vX.Y.Z on main  ->  verify -> assets -> release -> smoke
#
#   verify   tag == Cargo version (lockstep with every other version file),
#            tag is on main, CHANGELOG section exists, cargo deny
#   test     the ci.yml test suite on macOS
#   assets   release-build.yml: macOS arm64 / Linux x86_64+aarch64 / Windows
#            builds, checksums, build-provenance attestation
#   release  publishes a NON-draft GitHub Release; body = the CHANGELOG section
#   smoke    installs from the published release on macOS, Linux and Windows
#
# Manual dispatch on a BRANCH is a DRY RUN: verify (version/changelog checks
# are reported, not enforced), assets, then smoke against the built assets via
# a local file:// base URL. No release is created; the assets stay available as
# the `release-assets` workflow artifact. (Dispatching on a tag ref behaves
# like a tag push.)
#
# No Apple Developer account: the macOS app is ad-hoc signed, NOT notarized.
# curl does not set com.apple.quarantine, so the installer-delivered app opens.
# No Homebrew cask (decision: installer scripts and packages only).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build jobs only need to read the checkout. Write access is granted to the
# release job alone, which creates the GitHub release.
permissions:
  contents: read

# Same value as ci.yml: rust-cache hashes every CARGO_* variable into its key.
env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing is built or published unless the tag names the version every
  # manifest declares and the tests pass on the tagged commit.
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            tag="v${version}-dryrun"
            echo "::notice::DRY RUN on $GITHUB_REF_NAME: assets only, nothing is published (tag label $tag)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; release tags are cut from main's release merge commit"
            exit 1
          fi

      # Tag = Cargo.toml version = every other version file, the CHANGELOG has
      # the `## [x.y.z]` heading and an empty Unreleased, lockfiles are fresh.
      # On a dry run the same checks run but only report.
      - name: Release consistency
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/release/check-release.sh "$TAG"
          else
            scripts/release/check-release.sh --report
          fi

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny

      # CI runs cargo-deny only on dependency changes, while RustSec keeps
      # publishing advisories: an advisory published since then stops the
      # release here, before anything is built.
      - name: Dependency policy (cargo deny check)
        run: cargo deny check

  # The same tests ci.yml runs, on the platform that ships the app. (The Linux
  # lib tests do not compile on a real Linux host: src/always/replay_tests.rs
  # uses the macOS-only apple_stt / stt_apple modules ungated.)
  test:
    name: Tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-test-macos
          save-if: false

      - name: Test
        env:
          # kaldi-fbank-rust-kautism bundles C++14 code (see ci.yml).
          CXXFLAGS: -std=c++14
        run: cargo test --locked --bins --lib --tests -- --skip macos_overlay

  assets:
    name: Build and attest
    needs: [verify, test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}

  release:
    name: Publish release
    needs: [verify, assets]
    # Dry run (branch dispatch): assets stay as workflow artifacts only.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Publication only: the signing permissions stay with release-build.yml.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The files release-build.yml built and attested: archives, packages,
      # their .sha256, install.sh, install.ps1 and the provenance bundle.
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: assets

      # The release body is the tag's section of CHANGELOG.md (Keep a
      # Changelog: from "## [X.Y.Z]" to the next "## " heading).
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1 }
            inside && index($0, "## [" v "]") != 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no '## [${VERSION}]' section in CHANGELOG.md; the release body falls back to a link"
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          # install.sh / install.ps1 ship with the release, not from a branch:
          # main moves ahead of the latest release, and the documented
          # one-liners read releases/latest/download/, so they always run the
          # script of the release they install.
          files: |
            assets/always-*.tar.gz
            assets/always-*.zip
            assets/always-*.deb
            assets/always-*.rpm
            assets/always-*.sha256
            assets/always-*.intoto.jsonl
            assets/install.sh
            assets/install.ps1

  # Post-publish smoke test: installs what was just published (real release) or
  # what was just built (dry run, via file://), with the real installer scripts,
  # on each platform's own runner, and checks `always --version`.
  # A failure after publication cannot unpublish: it says the next patch is due.
  smoke:
    name: Smoke ${{ matrix.name }}
    needs: [verify, assets, release]
    # `release` is skipped on a dry run; run anyway unless something failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    # A branch dry run has no Windows asset while the Windows build is broken.
    continue-on-error: ${{ matrix.kind == 'windows' && github.ref_type != 'tag' }}
    strategy:
      # One broken platform must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64 / deb
            os: ubuntu-24.04
            kind: docker
            image: ubuntu:24.04
            method: auto
          - name: linux x86_64 / tar.gz
            os: ubuntu-24.04
            kind: docker
            image: ubuntu:24.04
            method: tar
          - name: linux x86_64 / rpm
            os: ubuntu-24.04
            kind: docker
            image: fedora:42
            method: auto
          - name: linux aarch64 / deb
            os: ubuntu-24.04-arm
            kind: docker
            image: ubuntu:24.04
            method: auto
          - name: linux aarch64 / rpm
            os: ubuntu-24.04-arm
            kind: docker
            image: fedora:42
            method: auto
          - name: macOS arm64
            os: macos-15
            kind: macos
          - name: windows x86_64
            os: windows-latest
            kind: windows
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      IS_RELEASE: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Dry run: the built assets, installed from a local directory.
      - name: Download the built assets (dry run)
        if: env.IS_RELEASE != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: assets

      # Real release: verify the provenance of what was published before
      # running any of it (the command SECURITY.md would give users).
      - name: Verify provenance of the published release
        if: env.IS_RELEASE == 'true' && matrix.kind != 'windows'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published" && cd "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'install.sh' --pattern 'install.ps1' --pattern '*.intoto.jsonl' --pattern '*.sha256' \
            --pattern 'always-*.tar.gz' --pattern 'always-*.zip' --pattern 'always-*.deb' --pattern 'always-*.rpm'
          for subject in always-*.tar.gz always-*.zip always-*.deb always-*.rpm install.sh install.ps1; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --bundle "always-$TAG.intoto.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          shasum -a 256 -c ./*.sha256

      - name: Linux (container)
        if: matrix.kind == 'docker'
        env:
          IMAGE: ${{ matrix.image }}
          METHOD: ${{ matrix.method }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = true ]; then
            # The documented one-liner, byte for byte, against the published release.
            mount_args=()
            env_args=(-e "ALWAYS_VERSION=$TAG")
            cmd='curl -fsSL "https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$TAG"'/install.sh" | bash'
          else
            mount_args=(-v "$PWD/assets:/assets:ro" -v "$PWD/scripts:/scripts:ro")
            env_args=(-e "ALWAYS_VERSION=$TAG" -e ALWAYS_BASE_URL=file:///assets)
            cmd='bash /scripts/install-always.sh'
          fi
          docker run --rm "${mount_args[@]}" "${env_args[@]}" \
            -e ALWAYS_METHOD="$METHOD" -e ALWAYS_SYSTEMD=0 -e CMD="$cmd" \
            "$IMAGE" \
            sh -c '
              set -eu
              if command -v apt-get >/dev/null; then
                apt-get update -qq && apt-get install -y -qq curl ca-certificates bash >/dev/null
              else
                dnf install -y -q curl ca-certificates bash >/dev/null
              fi
              bash -c "$CMD"
              command -v always >/dev/null || export PATH="$HOME/.local/bin:$PATH"
              always --version
            '

      - name: macOS
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export ALWAYS_APP_DIR="$HOME/Applications" ALWAYS_NO_LAUNCH=1 ALWAYS_VERSION="$TAG"
          if [ "$IS_RELEASE" = true ]; then
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" | bash
          else
            ALWAYS_BASE_URL="file://$PWD/assets" bash scripts/install-always.sh
          fi
          codesign --verify --deep --strict "$ALWAYS_APP_DIR/Always.app"
          test -x "$ALWAYS_APP_DIR/Always.app/Contents/MacOS/always-daemon"
          "$ALWAYS_APP_DIR/Always.app/Contents/MacOS/always-daemon" --version

      - name: Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ALWAYS_VERSION = $env:TAG
          $env:ALWAYS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Always'
          $env:ALWAYS_NO_PATH = '1'
          if ($env:IS_RELEASE -eq 'true') {
            $f = Join-Path $env:RUNNER_TEMP 'install.ps1'
            Invoke-WebRequest -UseBasicParsing -OutFile $f -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1"
            Get-Content -Raw $f | Invoke-Expression
          } else {
            $env:ALWAYS_BASE_URL = (Resolve-Path assets).Path
            Get-Content -Raw scripts/release/install.ps1 | Invoke-Expression
          }
          & (Join-Path $env:ALWAYS_INSTALL_DIR 'always.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'installed always.exe failed to run' }
