name: Release

# Release model (develop -> main branching; see
# .agents/skills/release/SKILL.md):
#
#   tag vX.Y.Z on main  ->  verify -> assets -> release -> smoke
#
#   verify   tag == Cargo version (lockstep with every other version file),
#            tag is on main, CHANGELOG section exists, cargo deny
#   test     the ci.yml test suite on macOS
#   assets   release-build.yml: macOS arm64 / Linux x86_64+aarch64 / Windows
#            builds, checksums, build-provenance attestation, minisign
#            signatures (*.minisig) for every archive/package/GUI installer
#            and both CLI installer scripts (secret ALWAYS_MINISIGN_SECRET_KEY;
#            a tag run without it fails, a dry run without it skips signing)
#   release  publishes a NON-draft GitHub Release; body = the CHANGELOG section
#   smoke    installs from the published release on macOS, Linux and Windows,
#            and checks every *.minisig against resources/update-signing.pub
#
# Manual dispatch on a BRANCH is a DRY RUN: verify (version/changelog checks
# are reported, not enforced), assets, then smoke against the built assets via
# a local file:// base URL. No release is created; the assets stay available as
# the `release-assets` workflow artifact. (Dispatching on a tag ref behaves
# like a tag push.)
#
# No Apple Developer account: the macOS app is ad-hoc signed, NOT notarized.
# curl does not set com.apple.quarantine, so the installer-delivered app opens.
# No Homebrew cask (decision: installer scripts and packages only).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Build jobs only need to read the checkout. Write access is granted to the
# release job alone, which creates the GitHub release.
permissions:
  contents: read

# Same value as ci.yml: rust-cache hashes every CARGO_* variable into its key.
env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate: nothing is built or published unless the tag names the version every
  # manifest declares and the tests pass on the tagged commit.
  verify:
    name: Verify tag and tests
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The job never pushes: do not leave the token in .git/config.
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            tag="v${version}-dryrun"
            echo "::notice::DRY RUN on $GITHUB_REF_NAME: assets only, nothing is published (tag label $tag)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Tag must be on main
        if: github.ref_type == 'tag'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; release tags are cut from main's release merge commit"
            exit 1
          fi

      # Tag = Cargo.toml version = every other version file, the CHANGELOG has
      # the `## [x.y.z]` heading and an empty Unreleased, lockfiles are fresh.
      # On a dry run the same checks run but only report.
      - name: Release consistency
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/release/check-release.sh "$TAG"
          else
            scripts/release/check-release.sh --report
          fi

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deny

      # CI runs cargo-deny only on dependency changes, while RustSec keeps
      # publishing advisories: an advisory published since then stops the
      # release here, before anything is built.
      - name: Dependency policy (cargo deny check)
        run: cargo deny check

  # The same tests ci.yml runs, on the platform that ships the app. (The Linux
  # lib tests do not compile on a real Linux host: src/always/replay_tests.rs
  # uses the macOS-only apple_stt / stt_apple modules ungated.)
  test:
    name: Tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-test-macos
          save-if: false

      - name: Test
        env:
          # kaldi-fbank-rust-kautism bundles C++14 code (see ci.yml).
          CXXFLAGS: -std=c++14
        run: cargo test --locked --bins --lib --tests -- --skip macos_overlay

  assets:
    name: Build and attest
    needs: [verify, test]
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      tag: ${{ needs.verify.outputs.tag }}
    # Passed explicitly (not `secrets: inherit`): the called workflow gets the
    # minisign signing key and nothing else.
    secrets:
      ALWAYS_MINISIGN_SECRET_KEY: ${{ secrets.ALWAYS_MINISIGN_SECRET_KEY }}
      ALWAYS_MINISIGN_PASSWORD: ${{ secrets.ALWAYS_MINISIGN_PASSWORD }}

  release:
    name: Publish release
    needs: [verify, assets]
    # Dry run (branch dispatch): assets stay as workflow artifacts only.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # Publication only: the signing permissions stay with release-build.yml.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The files release-build.yml built and attested: archives, CLI packages,
      # GUI installers, their .sha256 files, install.sh, install.ps1, the
      # provenance bundle and minisign signatures (*.minisig) the updater verifies.
      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: assets

      # The release body is the tag's section of CHANGELOG.md (Keep a
      # Changelog: from "## [X.Y.Z]" to the next "## " heading).
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v v="$VERSION" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1 }
            inside && index($0, "## [" v "]") != 1 { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::no '## [${VERSION}]' section in CHANGELOG.md; the release body falls back to a link"
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}/CHANGELOG.md)." > release-notes.md
          fi
          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          # install.sh / install.ps1 ship with the release, not from a branch:
          # main moves ahead of the latest release, and the documented
          # one-liners read releases/latest/download/, so they always run the
          # script of the release they install.
          files: |
            assets/always-*.tar.gz
            assets/always-*.zip
            assets/always-*.deb
            assets/always-*.rpm
            assets/always-*.AppImage
            assets/always-*-gui-setup.exe
            assets/always-*.sha256
            assets/always-*.intoto.jsonl
            assets/install.sh
            assets/install.ps1
            assets/*.minisig

  # Post-publish smoke test: installs what was just published (real release) or
  # what was just built (dry run, via file://), with the real installer scripts,
  # on each platform's own runner, and checks `always --version`.
  # A failure after publication cannot unpublish: it says the next patch is due.
  smoke:
    name: Smoke ${{ matrix.name }}
    needs: [verify, assets, release]
    # `release` is skipped on a dry run; run anyway unless something failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken platform must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64 / deb
            os: ubuntu-24.04
            kind: docker
            image: ubuntu:24.04
            method: auto
          - name: linux x86_64 / tar.gz
            os: ubuntu-24.04
            kind: docker
            image: ubuntu:24.04
            method: tar
          - name: linux x86_64 / rpm
            os: ubuntu-24.04
            kind: docker
            image: fedora:42
            method: auto
          - name: linux aarch64 / deb
            os: ubuntu-24.04-arm
            kind: docker
            image: ubuntu:24.04
            method: auto
          - name: linux aarch64 / rpm
            os: ubuntu-24.04-arm
            kind: docker
            image: fedora:42
            method: auto
          - name: macOS arm64
            os: macos-15
            kind: macos
          - name: windows x86_64
            os: windows-latest
            kind: windows
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      IS_RELEASE: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Dry run: the built assets, installed from a local directory.
      - name: Download the built assets (dry run)
        if: env.IS_RELEASE != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: assets

      # Real release: verify the provenance of what was published before
      # running any of it (the command SECURITY.md would give users).
      - name: Verify provenance of the published release
        if: env.IS_RELEASE == 'true' && matrix.kind != 'windows'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published" && cd "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'install.sh' --pattern 'install.ps1' --pattern '*.intoto.jsonl' --pattern '*.sha256' --pattern '*.minisig' \
            --pattern 'always-*.tar.gz' --pattern 'always-*.zip' --pattern 'always-*.deb' --pattern 'always-*.rpm' \
            --pattern 'always-*.AppImage' --pattern 'always-*-gui-setup.exe'
          for subject in always-*.tar.gz always-*.zip always-*.deb always-*.rpm always-*.AppImage always-*-gui-setup.exe install.sh install.ps1; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --bundle "always-$TAG.intoto.jsonl" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          shasum -a 256 -c ./*.sha256

      # --- minisign signatures (SPEC section 12a, rule U1) -------------------
      # Every .minisig that exists must verify with the public key committed in
      # this repo -- the same key `always update` has compiled in -- and name
      # its file and this tag. A real release must have them; a dry run without
      # the signing secret has none, and says so.
      #
      # minisign sources: ubuntu runners use the Ubuntu archive (apt checks its
      # GPG signature; noble/universe 0.11, https://packages.ubuntu.com/noble/minisign).
      # macOS and Windows use the upstream 0.12 release zip, pinned by SHA-256
      # (both checked against upstream's published minisign signature, made with
      # its well-known key RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3,
      # when the pins were taken): https://github.com/jedisct1/minisign/releases/tag/0.12
      - name: Install minisign (apt)
        if: matrix.kind == 'docker'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Install minisign (pinned release)
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/minisign-bin"
          mkdir -p "$d"
          curl -fsSL -o "$d/minisign.zip" "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-macos.zip"
          echo "89000b19535765f9cffc65a65d64a820f433ef6db8020667f7570e06bf6aac63  $d/minisign.zip" | shasum -a 256 -c -
          unzip -q -o "$d/minisign.zip" minisign -d "$d"
          chmod +x "$d/minisign"
          echo "$d" >> "$GITHUB_PATH"

      - name: Verify minisign signatures
        if: matrix.kind != 'windows'
        run: |
          set -euo pipefail
          minisign -v
          dir=assets
          [ "$IS_RELEASE" != true ] || dir="$RUNNER_TEMP/published"
          shopt -s nullglob
          sigs=("$dir"/*.minisig)
          if [ "${#sigs[@]}" -eq 0 ]; then
            if [ "$IS_RELEASE" = true ]; then
              echo "::error::the published release has no .minisig files"
              exit 1
            fi
            echo "::notice::no .minisig files in this dry run (signing was skipped); nothing to verify"
            exit 0
          fi
          for sig in "${sigs[@]}"; do
            f="${sig%.minisig}"
            [ -f "$f" ] || { echo "::error::$sig has no file $f next to it"; exit 1; }
            out="$(minisign -V -p resources/update-signing.pub -m "$f" -x "$sig")"
            echo "$out"
            case "$out" in
              *"file:$(basename "$f")"*"tag:$TAG"*) ;;
              *) echo "::error::$sig is not bound to file $(basename "$f") and tag $TAG"; exit 1 ;;
            esac
          done
          echo "verified ${#sigs[@]} signatures"

      - name: Install minisign and verify signatures (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $d = Join-Path $env:RUNNER_TEMP 'minisign-bin'
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          $zip = Join-Path $d 'minisign.zip'
          Invoke-WebRequest -UseBasicParsing -OutFile $zip -Uri 'https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip'
          $want = '37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479'
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "minisign zip checksum mismatch: $got" }
          Expand-Archive -LiteralPath $zip -DestinationPath $d -Force
          $minisign = Join-Path $d 'minisign-win64\x86_64\minisign.exe'

          if ($env:IS_RELEASE -eq 'true') {
            $dir = Join-Path $env:RUNNER_TEMP 'published'
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir $dir `
              --pattern 'install.ps1' --pattern 'install.ps1.minisig' `
              --pattern 'always-*-x86_64-pc-windows-msvc.zip' --pattern 'always-*-x86_64-pc-windows-msvc.zip.minisig' `
              --pattern 'always-*-x86_64-pc-windows-msvc-gui-setup.exe' --pattern 'always-*-x86_64-pc-windows-msvc-gui-setup.exe.minisig'
            if ($LASTEXITCODE -ne 0) { throw 'gh release download failed' }
          } else {
            $dir = (Resolve-Path assets).Path
          }
          $sigs = @(Get-ChildItem -LiteralPath $dir -Filter '*.minisig' |
            Where-Object { $_.Name -eq 'install.ps1.minisig' -or $_.Name -like 'always-*-x86_64-pc-windows-msvc.zip.minisig' -or $_.Name -like 'always-*-x86_64-pc-windows-msvc-gui-setup.exe.minisig' })
          if ($sigs.Count -eq 0) {
            if ($env:IS_RELEASE -eq 'true') { throw 'the published release has no .minisig files' }
            Write-Host '::notice::no .minisig files in this dry run (signing was skipped); nothing to verify'
            return
          }
          foreach ($sig in $sigs) {
            $file = $sig.FullName -replace '\.minisig$', ''
            if (-not (Test-Path -LiteralPath $file)) { throw "$($sig.Name) has no file next to it" }
            $out = (& $minisign -V -p resources/update-signing.pub -m $file -x $sig.FullName) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "minisign rejected $($sig.Name)" }
            Write-Host $out
            $leaf = Split-Path -Leaf $file
            if ($out -notmatch [regex]::Escape("file:$leaf") -or $out -notmatch [regex]::Escape("tag:$($env:TAG)")) {
              throw "$($sig.Name) is not bound to file $leaf and tag $($env:TAG)"
            }
          }
          Write-Host "verified $($sigs.Count) signatures"

      - name: Linux (container)
        if: matrix.kind == 'docker'
        env:
          IMAGE: ${{ matrix.image }}
          METHOD: ${{ matrix.method }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = true ]; then
            # The documented one-liner, byte for byte, against the published release.
            mount_args=()
            env_args=(-e "ALWAYS_VERSION=$TAG")
            cmd='curl -fsSL "https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/'"$TAG"'/install.sh" | bash'
          else
            mount_args=(-v "$PWD/assets:/assets:ro" -v "$PWD/scripts:/scripts:ro")
            env_args=(-e "ALWAYS_VERSION=$TAG" -e ALWAYS_BASE_URL=file:///assets)
            cmd='bash /scripts/install-always.sh'
          fi
          docker run --rm "${mount_args[@]}" "${env_args[@]}" \
            -e ALWAYS_METHOD="$METHOD" -e ALWAYS_SYSTEMD=0 -e CMD="$cmd" \
            "$IMAGE" \
            sh -c '
              set -eu
              if command -v apt-get >/dev/null; then
                apt-get update -qq && apt-get install -y -qq curl ca-certificates bash >/dev/null
                # A tarball has no package metadata, so install the runtime
                # libraries documented by install.sh and docs/SETUP.md.
                [ "$ALWAYS_METHOD" != tar ] || apt-get install -y -qq libasound2t64 libgcc-s1 libstdc++6 libx11-6 libxtst6 >/dev/null
              else
                dnf install -y -q curl ca-certificates bash >/dev/null
                [ "$ALWAYS_METHOD" != tar ] || dnf install -y -q alsa-lib libgcc libstdc++ libX11 libXtst >/dev/null
              fi
              bash -c "$CMD"
              command -v always >/dev/null || export PATH="$HOME/.local/bin:$PATH"
              always --version
            '

      - name: macOS
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          export ALWAYS_APP_DIR="$HOME/Applications" ALWAYS_NO_LAUNCH=1 ALWAYS_VERSION="$TAG"
          if [ "$IS_RELEASE" = true ]; then
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" | bash
          else
            ALWAYS_BASE_URL="file://$PWD/assets" bash scripts/install-always.sh
          fi
          codesign --verify --deep --strict "$ALWAYS_APP_DIR/Always.app"
          test -x "$ALWAYS_APP_DIR/Always.app/Contents/MacOS/always-daemon"
          "$ALWAYS_APP_DIR/Always.app/Contents/MacOS/always-daemon" --version

      - name: Windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ALWAYS_VERSION = $env:TAG
          $env:ALWAYS_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'Always'
          $env:ALWAYS_NO_PATH = '1'
          if ($env:IS_RELEASE -eq 'true') {
            $f = Join-Path $env:RUNNER_TEMP 'install.ps1'
            Invoke-WebRequest -UseBasicParsing -OutFile $f -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/install.ps1"
            Get-Content -Raw $f | Invoke-Expression
          } else {
            $env:ALWAYS_BASE_URL = (Resolve-Path assets).Path
            Get-Content -Raw scripts/release/install.ps1 | Invoke-Expression
          }
          & (Join-Path $env:ALWAYS_INSTALL_DIR 'always.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'installed always.exe failed to run' }

  # Install and launch the native GUI packages separately from the CLI
  # installer checks above. This proves each packaged UI can resolve and start
  # its colocated/resource daemon on its target operating system.
  smoke-gui:
    name: GUI install ${{ matrix.name }}
    needs: [verify, assets, release]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 deb and AppImage
            os: ubuntu-24.04
            kind: linux
            target: x86_64-unknown-linux-gnu
          - name: Linux aarch64 deb and AppImage
            os: ubuntu-24.04-arm
            kind: linux
            target: aarch64-unknown-linux-gnu
          - name: Windows x86_64 NSIS
            os: windows-latest
            kind: windows
            target: x86_64-pc-windows-msvc
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.verify.outputs.tag }}
      IS_RELEASE: ${{ github.ref_type == 'tag' }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download GUI packages (dry run)
        if: env.IS_RELEASE != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: assets

      - name: Download GUI packages (release)
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern "always-*-${{ matrix.target }}-gui.deb" \
            --pattern "always-*-${{ matrix.target }}-gui.deb.sha256" \
            --pattern "always-*-${{ matrix.target }}-gui.AppImage" \
            --pattern "always-*-${{ matrix.target }}-gui.AppImage.sha256" \
            --pattern "always-*-${{ matrix.target }}-gui-setup.exe" \
            --pattern "always-*-${{ matrix.target }}-gui-setup.exe.sha256"

      - name: Install GUI runtime dependencies (Linux)
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-0 libayatana-appindicator3-1 xvfb xauth

      - name: Install and launch Debian GUI package
        if: matrix.kind == 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(assets/always-"$TAG"-"$TARGET"-gui.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one GUI deb, found ${#debs[@]}"; exit 1; }
          cd assets
          sha256sum -c "${debs[0]##*/}.sha256"
          sudo apt-get install -y "./${debs[0]##*/}"
          daemon="/usr/lib/Always GUI/daemon/always"
          test -x "$daemon"
          "$daemon" --version
          xvfb-run -a /usr/bin/always-tauri >"$RUNNER_TEMP/always-deb-gui.log" 2>&1 &
          xvfb_pid=$!
          dump_gui_failure_diagnostics() {
            echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
            socket_path="${XDG_RUNTIME_DIR:-/tmp}/always.sock"
            echo "expected_socket=$socket_path exists=$(test -S "$socket_path" && echo yes || echo no)"
            pid_file="${XDG_CONFIG_HOME:-${HOME:-/root}/.config}/always/always.pid"
            echo "expected_pid_file=$pid_file exists=$(test -f "$pid_file" && echo yes || echo no)"
            if [ -f "$pid_file" ]; then printf 'pid_file_value='; IFS= read -r pid_value < "$pid_file" || true; printf '%s\n' "$pid_value"; fi
            echo '--- GUI log (last 100 lines) ---'
            tail -n 100 "$RUNNER_TEMP/always-deb-gui.log" || true
            echo '--- GUI and bundled daemon processes ---'
            for pid in $(pgrep -x always-tauri || true) $(pgrep -f '^/.*/daemon/always([[:space:]]|$)' || true); do
              [ -r "/proc/$pid/cmdline" ] || continue
              printf 'pid=%s exe=%s argv=' "$pid" "$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
              tr '\0' ' ' < "/proc/$pid/cmdline" || true
              printf '\n'
            done
          }
          gui_app_pid=
          for _ in $(seq 1 20); do
            kill -0 "$xvfb_pid" 2>/dev/null || { dump_gui_failure_diagnostics; exit 1; }
            gui_app_pid="$(pgrep -x always-tauri | sed -n '1p' || true)"
            if [ -n "$gui_app_pid" ] && pgrep -f '^/usr/lib/Always GUI/daemon/always run([[:space:]]|$)' >/dev/null; then break; fi
            sleep 1
          done
          if [ -z "$gui_app_pid" ] || ! kill -0 "$gui_app_pid" 2>/dev/null; then
            dump_gui_failure_diagnostics
            echo '::error::packaged Debian GUI did not remain alive'
            exit 1
          fi
          if ! pgrep -f '^/usr/lib/Always GUI/daemon/always run([[:space:]]|$)' >/dev/null; then
            dump_gui_failure_diagnostics
            echo '::error::packaged Debian GUI did not start its bundled daemon run process'
            exit 1
          fi
          gui_path="$(readlink -f "/proc/$gui_app_pid/exe" 2>/dev/null || true)"
          if [ "$gui_path" != /usr/bin/always-tauri ]; then
            dump_gui_failure_diagnostics
            echo "::error::unexpected Debian GUI path $gui_path"
            exit 1
          fi
          daemon_pids="$(pgrep -f '^/usr/lib/Always GUI/daemon/always run([[:space:]]|$)' || true)"
          if [ -z "$daemon_pids" ]; then
            dump_gui_failure_diagnostics
            echo '::error::packaged Debian daemon exited before cleanup'
            exit 1
          fi
          kill "$xvfb_pid" "$gui_app_pid" 2>/dev/null || true
          while IFS= read -r daemon_pid; do kill "$daemon_pid" 2>/dev/null || true; done <<< "$daemon_pids"
          wait "$xvfb_pid" 2>/dev/null || true

      - name: Launch packaged AppImage and its bundled daemon
        if: matrix.kind == 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(assets/always-"$TAG"-"$TARGET"-gui.AppImage)
          [ "${#images[@]}" -eq 1 ] || { echo "::error::expected one GUI AppImage, found ${#images[@]}"; exit 1; }
          cd assets
          image="${images[0]##*/}"
          sha256sum -c "$image.sha256"
          chmod +x "$image"
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a "./$image" >"$RUNNER_TEMP/always-appimage-gui.log" 2>&1 &
          xvfb_pid=$!
          dump_gui_failure_diagnostics() {
            echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-<unset>}"
            socket_path="${XDG_RUNTIME_DIR:-/tmp}/always.sock"
            echo "expected_socket=$socket_path exists=$(test -S "$socket_path" && echo yes || echo no)"
            pid_file="${XDG_CONFIG_HOME:-${HOME:-/root}/.config}/always/always.pid"
            echo "expected_pid_file=$pid_file exists=$(test -f "$pid_file" && echo yes || echo no)"
            if [ -f "$pid_file" ]; then printf 'pid_file_value='; IFS= read -r pid_value < "$pid_file" || true; printf '%s\n' "$pid_value"; fi
            echo '--- GUI log (last 100 lines) ---'
            tail -n 100 "$RUNNER_TEMP/always-appimage-gui.log" || true
            echo '--- GUI and bundled daemon processes ---'
            for pid in $(pgrep -x always-tauri || true) $(pgrep -f '^/.*/daemon/always([[:space:]]|$)' || true); do
              [ -r "/proc/$pid/cmdline" ] || continue
              printf 'pid=%s exe=%s argv=' "$pid" "$(readlink -f "/proc/$pid/exe" 2>/dev/null || true)"
              tr '\0' ' ' < "/proc/$pid/cmdline" || true
              printf '\n'
            done
          }
          gui_app_pid=
          daemon_pid=
          for _ in $(seq 1 20); do
            kill -0 "$xvfb_pid" 2>/dev/null || { dump_gui_failure_diagnostics; exit 1; }
            gui_app_pid="$(pgrep -x always-tauri | sed -n '1p' || true)"
            daemon_pid="$(pgrep -f '^/.*/daemon/always run([[:space:]]|$)' | sed -n '1p' || true)"
            if [ -n "$gui_app_pid" ] && [ -n "$daemon_pid" ]; then break; fi
            sleep 1
          done
          if [ -z "$gui_app_pid" ] || ! kill -0 "$gui_app_pid" 2>/dev/null; then
            dump_gui_failure_diagnostics
            echo '::error::packaged AppImage GUI did not remain alive'
            exit 1
          fi
          if [ -z "$daemon_pid" ] || ! kill -0 "$daemon_pid" 2>/dev/null; then
            dump_gui_failure_diagnostics
            echo '::error::packaged AppImage GUI did not start its bundled daemon run process'
            exit 1
          fi
          gui_path="$(readlink -f "/proc/$gui_app_pid/exe" 2>/dev/null || true)"
          case "$gui_path" in */always-tauri) ;; *) dump_gui_failure_diagnostics; echo "::error::unexpected AppImage GUI path $gui_path"; exit 1 ;; esac
          daemon_path="$(readlink -f "/proc/$daemon_pid/exe" 2>/dev/null || true)"
          case "$daemon_path" in */daemon/always) ;; *) dump_gui_failure_diagnostics; echo "::error::unexpected bundled daemon path $daemon_path"; exit 1 ;; esac
          if [ "$daemon_path" = "/usr/lib/Always GUI/daemon/always" ]; then dump_gui_failure_diagnostics; echo "::error::AppImage reused the Debian daemon"; exit 1; fi
          kill "$xvfb_pid" "$gui_app_pid" "$daemon_pid" 2>/dev/null || true
          wait "$xvfb_pid" 2>/dev/null || true

      - name: Install and launch NSIS GUI package
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerPattern = "always-$env:TAG-$env:TARGET-gui-setup.exe"
          $installers = @(Get-ChildItem assets -Filter $installerPattern)
          if ($installers.Count -ne 1) { throw "Expected one GUI installer, found $($installers.Count)" }
          $hashLine = (Get-Content -Raw "$($installers[0].FullName).sha256").Trim()
          $expectedHash = ($hashLine -split '\s+')[0].ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 $installers[0].FullName).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "GUI installer checksum mismatch: $actualHash" }
          $installRoot = Join-Path $env:RUNNER_TEMP 'AlwaysGui'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installer exited $($install.ExitCode)" }
          $gui = Join-Path $installRoot 'always-tauri.exe'
          $daemon = Join-Path $installRoot 'daemon\always.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf)) { throw "GUI executable missing: $gui" }
          if (-not (Test-Path -LiteralPath $daemon -PathType Leaf)) { throw "Bundled daemon missing: $daemon" }
          & $daemon --version
          if ($LASTEXITCODE -ne 0) { throw 'bundled daemon failed to run' }
          $app = Start-Process -FilePath $gui -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "GUI exited early with code $($app.ExitCode)" }
          $daemonProcess = $null
          for ($i = 0; $i -lt 20; $i++) {
            $daemonProcess = Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -ieq $daemon } | Select-Object -First 1
            if ($daemonProcess) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $daemonProcess) { throw "GUI did not start bundled daemon $daemon" }
          Stop-Process -Id $app.Id -Force
          Stop-Process -Id $daemonProcess.ProcessId -Force
