name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write       # create GitHub Release + upload assets
  id-token: write       # cosign keyless OIDC + SLSA provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build + sign + notarize macOS bundle
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.value }}
      dmg_sha256: ${{ steps.dmg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build
        uses: actions/cache@v5
        with:
          path: target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build daemon (universal)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/always \
            target/aarch64-apple-darwin/release/always \
            target/x86_64-apple-darwin/release/always
          file target/universal/release/always

      - name: Import signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build + codesign + notarize Swift app
        env:
          ALWAYS_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALWAYS_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          ALWAYS_NOTARIZE_APP_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ALWAYS_BUILD_PROFILE: release
        run: |
          cd AlwaysApp
          ./build.sh
          codesign -dv --verbose=2 AlwaysApp.app
          spctl -a -t exec -vv AlwaysApp.app

      - name: Build DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG="always-${{ steps.version.outputs.value }}.dmg"
          mkdir -p target/dmg-staging
          cp -R AlwaysApp/AlwaysApp.app target/dmg-staging/
          ln -s /Applications target/dmg-staging/Applications || true
          hdiutil create -ov -volname "Always ${{ steps.version.outputs.value }}" \
            -srcfolder target/dmg-staging -format UDZO "$DMG"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "$SHA  $DMG" > "$DMG.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output-pattern bom -- --locked
          mv bom.json always-${{ steps.version.outputs.value }}.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature always-${{ steps.version.outputs.value }}.dmg.sig \
            --output-certificate always-${{ steps.version.outputs.value }}.dmg.pem \
            always-${{ steps.version.outputs.value }}.dmg

      - name: Install Sparkle tooling
        # `sign_update` ships in the Sparkle distribution. Brew installs the
        # full Sparkle.app which includes the binary in its Resources dir.
        run: |
          brew install --cask sparkle
          SPARKLE_BIN="$(find /Applications /opt/homebrew/Caskroom -name sign_update -type f 2>/dev/null | head -1)"
          echo "$(dirname "$SPARKLE_BIN")" >> "$GITHUB_PATH"

      - name: Generate signed appcast.xml
        env:
          ALWAYS_VERSION: ${{ steps.version.outputs.value }}
          ALWAYS_DMG_PATH: always-${{ steps.version.outputs.value }}.dmg
          ALWAYS_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Materialize the private key from the secret to a tmp file the
          # Sparkle tooling can read.
          KEY_PATH="$RUNNER_TEMP/sparkle_ed_private.key"
          echo "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export SPARKLE_ED_PRIVATE_KEY_PATH="$KEY_PATH"
          ./scripts/generate-appcast.sh
          rm "$KEY_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            always-${{ steps.version.outputs.value }}.dmg
            always-${{ steps.version.outputs.value }}.dmg.sha256
            always-${{ steps.version.outputs.value }}.dmg.sig
            always-${{ steps.version.outputs.value }}.dmg.pem
            always-${{ steps.version.outputs.value }}.cdx.json
            appcast.xml

  build-linux:
    name: Build Linux daemon (CLI-only)
    runs-on: ubuntu-latest
    outputs:
      tarball_sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA + SQLite headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libsqlite3-dev pkg-config

      - name: Build release
        run: cargo build --release --no-default-features --features linux --locked

      - name: Package tarball
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="always-${VERSION}-linux-x86_64.tar.gz"
          tar -C target/release -czf "$NAME" always
          SHA=$(shasum -a 256 "$NAME" | awk '{print $1}')
          echo "$SHA  $NAME" > "$NAME.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            always-*-linux-x86_64.tar.gz
            always-*-linux-x86_64.tar.gz.sha256

  publish:
    name: Publish GitHub Release + crates.io
    runs-on: ubuntu-latest
    needs: [build-mac, build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release

      - name: Generate consolidated SHA256SUMS
        run: |
          shasum -a 256 always-*.dmg always-*.tar.gz \
            always-*.cdx.json > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            always-*.dmg
            always-*.dmg.sha256
            always-*.dmg.sig
            always-*.dmg.pem
            always-*.cdx.json
            always-*.tar.gz
            always-*.tar.gz.sha256
            appcast.xml
            SHA256SUMS

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

  homebrew:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    needs: [build-mac, publish]
    steps:
      - name: Open auto-PR against rtk-ai/homebrew-tap
        uses: dawidd6/action-homebrew-bump-formula@v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: rtk-ai/homebrew-tap
          formula: always
          tag: ${{ github.ref_name }}
          revision: ${{ github.sha }}

  slsa:
    name: SLSA Level 3 provenance
    needs: [build-mac, build-linux]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build-mac.outputs.dmg_sha256 }}
      upload-assets: true
