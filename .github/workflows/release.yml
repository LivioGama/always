name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to build (e.g. v1.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write       # create GitHub Release + upload assets
  id-token: write       # cosign keyless OIDC + SLSA provenance

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-mac:
    name: Build + sign + notarize macOS bundle
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_sha: ${{ steps.release-ref.outputs.sha }}
      dmg_sha256: ${{ steps.dmg.outputs.sha256 }}
      dmg_subject: ${{ steps.dmg.outputs.subject }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Resolve version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Resolve release commit
        id: release-ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release secrets preflight
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: ./scripts/release-preflight.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build daemon (macOS arm64)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/always

      - name: Import signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          USER_KEYCHAINS=()
          while IFS= read -r keychain; do
            USER_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${USER_KEYCHAINS[@]}"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build + codesign + notarize Swift app
        env:
          ALWAYS_NOTARIZE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ALWAYS_NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          ALWAYS_NOTARIZE_APP_PWD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          ALWAYS_BUILD_PROFILE: release
          ALWAYS_SWIFT_CONFIGURATION: release
          ALWAYS_DAEMON_PATH: ${{ github.workspace }}/target/aarch64-apple-darwin/release/always
        run: |
          cd Always
          ./build.sh
          # Verify post-notarization. Both checks must pass — staple is what
          # makes the app gatekeeper-clean offline; spctl is what the
          # OS actually evaluates at first launch. We run them only AFTER
          # build.sh's notarize+staple step so the ticket is embedded.
          codesign -dv --verbose=2 Always.app
          spctl -a -t exec -vv Always.app

      - name: Build DMG
        id: dmg
        run: |
          set -euo pipefail
          DMG="always-${{ steps.version.outputs.value }}.dmg"
          mkdir -p target/dmg-staging
          cp -R Always/Always.app target/dmg-staging/
          ln -s /Applications target/dmg-staging/Applications || true
          hdiutil create -ov -volname "Always ${{ steps.version.outputs.value }}" \
            -srcfolder target/dmg-staging -format UDZO "$DMG"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "$SHA  $DMG" > "$DMG.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "subject=$SHA  $DMG" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --output-pattern bom -- --locked
          mv bom.json always-${{ steps.version.outputs.value }}.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts (cosign keyless)
        run: |
          cosign sign-blob --yes \
            --output-signature always-${{ steps.version.outputs.value }}.dmg.sig \
            --output-certificate always-${{ steps.version.outputs.value }}.dmg.pem \
            always-${{ steps.version.outputs.value }}.dmg

      - name: Install Sparkle tooling
        # `sign_update` ships in the Sparkle distribution. Brew installs the
        # full Sparkle.app which includes the binary in its Resources dir.
        run: |
          brew install --cask sparkle
          SPARKLE_BIN="$(find /Applications /opt/homebrew/Caskroom -name sign_update -type f 2>/dev/null | head -1)"
          dirname "$SPARKLE_BIN" >> "$GITHUB_PATH"

      - name: Generate signed appcast.xml
        env:
          ALWAYS_VERSION: ${{ steps.version.outputs.value }}
          ALWAYS_DMG_PATH: always-${{ steps.version.outputs.value }}.dmg
          ALWAYS_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ env.RELEASE_TAG }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Materialize the private key from the secret to a tmp file the
          # Sparkle tooling can read.
          KEY_PATH="$RUNNER_TEMP/sparkle_ed_private.key"
          echo "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          export SPARKLE_ED_PRIVATE_KEY_PATH="$KEY_PATH"
          ./scripts/generate-appcast.sh
          rm "$KEY_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            always-${{ steps.version.outputs.value }}.dmg
            always-${{ steps.version.outputs.value }}.dmg.sha256
            always-${{ steps.version.outputs.value }}.dmg.sig
            always-${{ steps.version.outputs.value }}.dmg.pem
            always-${{ steps.version.outputs.value }}.cdx.json
            appcast.xml

  build-linux:
    name: Build Linux daemon (CLI-only)
    runs-on: ubuntu-latest
    outputs:
      tarball_sha256: ${{ steps.pkg.outputs.sha256 }}
      tarball_subject: ${{ steps.pkg.outputs.subject }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA + SQLite headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libsqlite3-dev pkg-config

      - name: Build release
        run: cargo build --release --no-default-features --features linux --locked

      - name: Package tarball
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NAME="always-${VERSION}-linux-x86_64.tar.gz"
          tar -C target/release -czf "$NAME" always
          SHA=$(shasum -a 256 "$NAME" | awk '{print $1}')
          echo "$SHA  $NAME" > "$NAME.sha256"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "subject=$SHA  $NAME" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            always-*-linux-x86_64.tar.gz
            always-*-linux-x86_64.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-linux]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release

      - name: Generate consolidated SHA256SUMS
        run: |
          shasum -a 256 always-*.dmg always-*.tar.gz \
            always-*.cdx.json > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          files: |
            always-*.dmg
            always-*.dmg.sha256
            always-*.dmg.sig
            always-*.dmg.pem
            always-*.cdx.json
            always-*.tar.gz
            always-*.tar.gz.sha256
            appcast.xml
            SHA256SUMS

  homebrew:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    needs: [build-mac, publish]
    steps:
      - name: Open auto-PR against rtk-ai/homebrew-tap
        uses: dawidd6/action-homebrew-bump-formula@v7
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          tap: rtk-ai/homebrew-tap
          formula: always
          tag: ${{ env.RELEASE_TAG }}
          revision: ${{ needs.build-mac.outputs.release_sha }}

  slsa-subjects:
    name: Prepare SLSA subjects
    runs-on: ubuntu-latest
    needs: [build-mac, build-linux]
    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
    steps:
      - name: Encode sha256sum subjects
        id: subjects
        run: |
          SUBJECTS="$(printf '%s\n%s\n' \
            "${{ needs.build-mac.outputs.dmg_subject }}" \
            "${{ needs.build-linux.outputs.tarball_subject }}")"
          echo "base64_subjects=$(printf '%s' "$SUBJECTS" | base64 -w0)" >> "$GITHUB_OUTPUT"

  slsa:
    name: SLSA Level 3 provenance
    needs: [build-mac, build-linux, slsa-subjects]
    permissions:
      id-token: write
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.slsa-subjects.outputs.base64_subjects }}
      upload-assets: true
