name: CodeQL

on:
  # Pushes: main only. develop is covered by its PRs (below) and the weekly
  # scheduled run, which GitHub always runs on the default branch (develop).
  push:
    branches: [main]
  # PRs: only when something CodeQL analyses can change — Swift sources
  # (Always, swift, capture, preview-asr) or the workflows (`actions` language).
  # CodeQL is not a required check, so a workflow-level filter is safe here.
  pull_request:
    branches: [main, develop]
    paths:
      - 'Always/**'
      - 'swift/**'
      - 'capture/**'
      - 'preview-asr/**'
      - '.github/workflows/**'
  schedule:
    # Weekly Monday 06:00 UTC — catch advisories that land between PRs.
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CodeQL ships first-class Swift support; Rust uses the
          # community-maintained queries via `rust` build-mode.
          - language: swift
            runner: macos-14
          - language: actions
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Build Swift app
        if: matrix.language == 'swift'
        run: |
          cd Always
          swift build

      - name: Perform analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
