name: Build All Platforms

# Triggers on tags matching `v*`.  Also accepts a version input for manual
# runs — the runner will check out that ref and use its Cargo.toml version.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v0.2.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write       # create / publish GitHub Release
  id-token: write       # cosign keyless signing, SLSA

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

# ─────────────────────────────────────────────────────────────────────────────
# macOS — Tauri bundle (DMG + app) + code-sign + notarize
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-macos:
    name: macOS (arm64)
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.value }}
      dmg_path: ${{ steps.package.outputs.dmg_path }}
      dmg_sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      # ── Version ────────────────────────────────────────────────────────────
      - name: Resolve version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      # ── Toolchains ─────────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          shared-keys: |
            build-macos
            arm64
          cache-directives: |
            Cargo.toml

      # ── Import signing certificate ─────────────────────────────────────────
      - name: Import signing certificate
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MAC_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          USER_KEYCHAINS=()
          while IFS= read -r keychain; do
            USER_KEYCHAINS+=("$keychain")
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$KEYCHAIN_PATH" "${USER_KEYCHAINS[@]}"
          rm "$RUNNER_TEMP/cert.p12"

      # ── Tauri build + bundle ───────────────────────────────────────────────
      - name: Install npm deps
        working-directory: always-gui
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build Tauri app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CI: "true"
        run: npx tauri build --target aarch64-apple-darwin --locked

      # ── Codesign & notarize individual binaries ────────────────────────────
      - name: Codesign CLI binary
        run: codesign -s "-" target/aarch64-apple-darwin/release/always

      # The Tauri-built DMG lives under:
      #   target/<target>/bundle/…/
      - name: Find DMG
        id: package
        run: |
          DMG=$(find target/aarch64-apple-darwin/release/bundle -name '*.dmg' -type f | head -1)
          echo "dmg_path=$DMG" >> "$GITHUB_OUTPUT"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "DMG=$DMG"

      # ── Upload DMG ─────────────────────────────────────────────────────────
      - name: Upload macOS DMG
        id: dmg-upload
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: ${{ steps.package.outputs.dmg_path }}
          retention-days: 7

      - name: Upload SHA256
        uses: actions/upload-artifact@v4
        with:
          name: dmg-sha
          path: |
            ${{ steps.package.outputs.dmg_path }}.sha256
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Linux — deb + AppImage (Tauri bundle)
  # ──────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    outputs:
      deb_path: ${{ steps.pack.outputs.deb }}
      appimage_path: ${{ steps.pack.outputs.appimage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            libsqlite3-dev \
            libasound2-dev \
            pkg-config \
            libdbus-1-dev \
            libglib2.0-dev \
            ninja-build \
            cmake \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgdk-pixbuf-2.0-dev

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          shared-keys: |
            build-linux

      - name: Install npm deps
        working-directory: always-gui
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build Tauri app (deb + AppImage)
        env:
          CI: "true"
        run: npx tauri build --locked

      - name: Collect artifacts
        id: pack
        run: |
          DEB=$(find target/release/bundle/deb -name '*.deb' -type f | head -1)
          APPIMAGE=$(find target/release/bundle/appimage -name '*.AppImage' -type f | head -1)
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "DEB=$DEB  APPIMAGE=$APPIMAGE"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: ${{ steps.pack.outputs.deb }}
          retention-days: 7

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: ${{ steps.pack.outputs.appimage }}
          retention-days: 7

      - name: Upload CLI tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: target/release/always
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Windows — MSI + NSIS (Tauri bundle)
  # ──────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    outputs:
      msi_path: ${{ steps.pack.outputs.msi }}
      nsi_path: ${{ steps.pack.outputs.nsi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: Swatinem/rust-cache@v2
        with:
          shared-keys: |
            build-windows

      - name: Install npm deps
        working-directory: always-gui
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Build Tauri app (MSI + NSIS)
        env:
          CI: "true"
        run: npx tauri build --locked

      - name: Collect artifacts
        id: pack
        shell: pwsh
        run: |
          $MSI = Get-ChildItem -Path target/release/bundle/msi -Filter '*.msi' -Recurse | Select-Object -First 1
          $NSI = Get-ChildItem -Path target/release/bundle/nsis -Filter '*.nsi' -Recurse | Select-Object -First 1
          # Also grab the NSIS .exe installer
          $NSIEXE = Get-ChildItem -Path target/release/bundle/nsis -Filter '*.exe' -Recurse | Select-Object -First 1
          echo "msi=$($MSI.FullName)" >> $env:GITHUB_OUTPUT
          echo "nsi=$($NSIEXE.FullName)" >> $env:GITHUB_OUTPUT
          echo "MSI=$($MSI.FullName)  NSIS=$($NSIEXE.FullName)"

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: ${{ steps.pack.outputs.msi }}
          retention-days: 7

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: ${{ steps.pack.outputs.nsi }}
          retention-days: 7

      - name: Upload CLI exe
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli
          path: target/release/always.exe
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Release — publish all artifacts as a GitHub Release
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: echo "value=$(grep '^version' Cargo.toml | head -1 | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts for release
        run: |
          mkdir -p release
          # DMG
          if [[ -f artifacts/dmg/* ]]; then
            cp artifacts/dmg/* release/
          fi
          # SHA
          if [[ -f artifacts/dmg-sha/* ]]; then
            cp artifacts/dmg-sha/* release/
          fi
          # Linux DEB
          if [[ -f artifacts/linux-deb/* ]]; then
            cp artifacts/linux-deb/* release/
          fi
          # Linux AppImage
          if [[ -f artifacts/linux-appimage/* ]]; then
            cp artifacts/linux-appimage/* release/
          fi
          # Linux CLI
          if [[ -f artifacts/linux-cli/always ]]; then
            cp artifacts/linux-cli/always release/
          fi
          # Windows MSI
          if [[ -f artifacts/windows-msi/* ]]; then
            cp artifacts/windows-msi/* release/
          fi
          # Windows NSIS
          if [[ -f artifacts/windows-nsis/* ]]; then
            cp artifacts/windows-nsis/* release/
          fi
          # Windows CLI
          if [[ -f artifacts/windows-cli/always.exe ]]; then
            cp artifacts/windows-cli/always.exe release/
          fi
          # Also grab any other artifacts
          cp -r artifacts/always-*/* release/ 2>/dev/null || true
          ls -la release/

      - name: Generate SHA256 checksums
        working-directory: release
        run: |
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate latest.json for Tauri updater
        id: updater
        run: |
          # Extract pubkey from tauri.conf.json
          PUBKEY=$(grep '"pubkey"' tauri.conf.json | sed 's/.*"pubkey": *"//;s/".*//')
          VERSION="${{ steps.version.outputs.value }}"
          cat > release/latest.json <<UPDATER_EOF
          {
            "version": "${VERSION}",
            "notes": "Always ${VERSION} — see https://github.com/LivioGama/always/releases/tag/${{ github.ref_name }} for details.",
            "pub_key": "${PUBKEY}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": "https://github.com/LivioGama/always/releases/download/${{ github.ref_name }}/always-${VERSION}-arm64.dmg",
              "linux-x86_64": "https://github.com/LivioGama/always/releases/download/${{ github.ref_name }}/always_${VERSION}_amd64.deb",
              "windows-x86_64": "https://github.com/LivioGama/always/releases/download/${{ github.ref_name }}/Always_${VERSION}_x64-setup.exe"
            }
          }
          UPDATER_EOF
          cat release/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Always ${{ steps.version.outputs.value }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Downloads

            | Platform | Format | File |
            |----------|--------|------|
            | macOS (Apple Silicon) | DMG | `always-*.dmg` |
            | Linux | DEB | `always-*.deb` |
            | Linux | AppImage | `always-*.AppImage` |
            | Windows | MSI | `always-*.msi` |
            | Windows | NSIS (exe) | `always-*.exe` |

            ### One-line install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/LivioGama/always/main/scripts/install-always.sh | bash
            ```

            ### Manual install (Linux)

            The Tauri GUI requires `webkit2gtk-4.1` on Linux. Install dependencies first:

            ```bash
            sudo apt install libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
            sudo dpkg -i always-*.deb
            ```

            For a portable install, use the AppImage:

            ```bash
            curl -LO https://github.com/LivioGama/always/releases/download/vVERSION/always-VERSION-linux-x86_64.AppImage
            chmod +x always-*.AppImage
            ./always-*.AppImage
            ```

            ## Changelog

            See [CHANGELOG.md](https://github.com/LivioGama/always/blob/main/docs/RELEASE.md) for details.
          files: |
            release/*