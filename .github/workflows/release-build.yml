name: Release build

# Builds, packages and attests everything a release publishes. Called by
# release.yml once its `verify` job passed. It lives in its own reusable
# workflow so the build-provenance attestation's signer is this file, not the
# caller: `gh attestation verify --signer-workflow
# LivioGama/always/.github/workflows/release-build.yml` accepts only what this
# file built. Its one secret is the minisign signing key, used by the `attest`
# job alone (see "Sign the release assets").
#
# Assets (stable contract, shared with scripts/release/install.sh / install.ps1
# and the updater, SPEC section 12a):
#   always-<tag>-aarch64-apple-darwin.tar.gz      Always.app (ad-hoc signed, not notarized)
#   always-<tag>-x86_64-unknown-linux-gnu.{tar.gz,deb,rpm}
#   always-<tag>-aarch64-unknown-linux-gnu.{tar.gz,deb,rpm}
#   always-<tag>-x86_64-pc-windows-msvc.zip
#   always-<tag>-<linux-target>-gui.{deb,AppImage}
#   always-<tag>-x86_64-pc-windows-msvc-gui-setup.exe
#   <each of the above>.sha256, install.sh, install.ps1, always-<tag>.intoto.jsonl
#   <each archive/package/GUI installer, install.sh and install.ps1>.minisig
#       minisign signature, verified by `always update` against the public key
#       compiled into the app (resources/update-signing.pub). Trusted comment:
#       timestamp:<unix> TAB file:<asset name> TAB tag:<tag>.
#
# Linux is glibc, not musl: the ONNX Runtime that `ort` downloads has no musl
# build, and the speaker/VAD models are not optional.
on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag, or v<version>-dryrun for a branch dry run'
        required: true
        type: string
    secrets:
      # The private half of resources/update-signing.pub, minisign secret key
      # file contents (unencrypted, or encrypted with the password below).
      ALWAYS_MINISIGN_SECRET_KEY:
        required: false
      # Only if the key is encrypted; leave unset for an unencrypted key.
      ALWAYS_MINISIGN_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  build-macos:
    name: Build aarch64-apple-darwin
    # macOS 26 runner = Xcode 26 SDK. The Apple STT (SpeechAnalyzer) and
    # Apple Intelligence (FoundationModels) bridges need it; with an older SDK
    # build.rs silently compiles stubs and the app reports
    # "Apple STT not available in this build".
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}

      - name: Cache SwiftPM builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Always/.build
            preview-asr/.build
          key: swiftpm-release-${{ runner.os }}-${{ hashFiles('preview-asr/Package.resolved') }}
          restore-keys: |
            swiftpm-release-${{ runner.os }}-

      - name: Build daemon
        env:
          # kaldi-fbank-rust-kautism bundles C++14 code (see ci.yml).
          CXXFLAGS: -std=c++14
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          file target/aarch64-apple-darwin/release/always
          # Never ship the SDK stubs (see runs-on above).
          if grep -aq 'SDK requirement not met' target/aarch64-apple-darwin/release/always; then
            echo "::error::daemon was built with the Apple STT / Apple Intelligence stubs (SDK too old)"
            exit 1
          fi

      # No x86_64 macOS build: ort-sys ships no prebuilt ONNX Runtime for
      # x86_64-apple-darwin.

      - name: Build Always.app (build.sh, release profile)
        env:
          ALWAYS_BUILD_PROFILE: release
          ALWAYS_SWIFT_CONFIGURATION: release
          ALWAYS_DAEMON_PATH: ${{ github.workspace }}/target/aarch64-apple-darwin/release/always
          # Ad-hoc ("-"): no certificate, no notarization. build.sh signs the
          # bundle with `codesign --force --deep` (plus the entitlements and
          # bundle identifier), which is what we ship.
          ALWAYS_CODESIGN_IDENTITY: "-"
          # build.sh also "deploys"; keep that away from /Applications.
          ALWAYS_DEPLOY_PATH: ${{ runner.temp }}/deploy/Always.app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deploy"
          cd Always
          ./build.sh
          codesign --verify --deep --strict --verbose=2 Always.app
          codesign -dv Always.app 2>&1 | grep -E 'Signature|Identifier'
          ls -l Always.app/Contents/MacOS

      - name: Package
        run: |
          set -euo pipefail
          TARGET=aarch64-apple-darwin
          STAGING="always-${TAG}-${TARGET}"
          ARCHIVE="${STAGING}.tar.gz"
          mkdir -p "$STAGING"
          # ditto keeps the signature, symlinks and xattrs intact.
          ditto Always/Always.app "$STAGING/Always.app"
          cp README.md LICENSE "$STAGING/"
          # COPYFILE_DISABLE: no AppleDouble (._*) files in the archive.
          COPYFILE_DISABLE=1 tar czf "$ARCHIVE" "$STAGING"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          # Round trip: the extracted bundle must still verify.
          d="$(mktemp -d)"
          tar xzf "$ARCHIVE" -C "$d"
          codesign --verify --deep --strict "$d/$STAGING/Always.app"
          test -x "$d/$STAGING/Always.app/Contents/MacOS/always-daemon"
          rm -rf "$d"
          ls -l always-*

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: always-aarch64-apple-darwin
          path: |
            always-*.tar.gz
            always-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # 24.04 on purpose: the oldest runner whose glibc (2.39) the ONNX
          # Runtime needs, so the binaries run on the widest range of hosts.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libssl-dev pkg-config g++ cmake libclang-dev rpm \
            libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev xdotool

      - name: Install cargo-deb and cargo-generate-rpm
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      # Include the local engines offered by Settings; offline model selection
      # must work without Groq credentials. `cpal` supplies native audio capture.
      - name: Build daemon (linux,cpal,local-stt)
        run: cargo build --release --locked --no-default-features --features linux,cpal,local-stt

      - name: Prepare bundled daemon for Always GUI
        run: |
          set -euo pipefail
          mkdir -p crates/always_tauri/bundle/daemon
          install -m 755 target/release/always crates/always_tauri/bundle/daemon/always
          crates/always_tauri/bundle/daemon/always --version

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install GUI dependencies
        working-directory: always-gui
        run: bun install --frozen-lockfile

      - name: Build GUI frontend
        working-directory: always-gui
        run: bun run build

      - name: Build Always GUI installers
        working-directory: crates/always_tauri
        run: bun ../../always-gui/node_modules/@tauri-apps/cli/tauri.js build --bundles deb,appimage

      - name: Package and inspect Always GUI installers
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BUNDLE="crates/always_tauri/target/release/bundle"
          shopt -s nullglob
          debs=("$BUNDLE/deb/"*.deb)
          appimages=("$BUNDLE/appimage/"*.AppImage)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::expected one GUI deb, found ${#debs[@]}"; exit 1; }
          [ "${#appimages[@]}" -eq 1 ] || { echo "::error::expected one GUI AppImage, found ${#appimages[@]}"; exit 1; }
          GUI_DEB="always-${TAG}-${TARGET}-gui.deb"
          GUI_APPIMAGE="always-${TAG}-${TARGET}-gui.AppImage"
          cp "${debs[0]}" "$GUI_DEB"
          cp "${appimages[0]}" "$GUI_APPIMAGE"
          chmod +x "$GUI_APPIMAGE"
          dpkg-deb --info "$GUI_DEB"
          dpkg-deb --contents "$GUI_DEB" | tee gui-deb-files.txt
          grep -Fq "/usr/bin/always-tauri" gui-deb-files.txt
          grep -Fq "/usr/lib/Always GUI/daemon/always" gui-deb-files.txt
          "$GUI_APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/always-tauri
          test -x "squashfs-root/usr/lib/Always GUI/daemon/always"
          "squashfs-root/usr/lib/Always GUI/daemon/always" --version
          rm -rf squashfs-root gui-deb-files.txt
          for f in "$GUI_DEB" "$GUI_APPIMAGE"; do sha256sum "$f" > "$f.sha256"; done
          ls -l always-*-gui.*

      - name: Upload GUI installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: always-${{ matrix.target }}-gui
          path: |
            always-*-gui.deb
            always-*-gui.deb.sha256
            always-*-gui.AppImage
            always-*-gui.AppImage.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Smoke-test binary
        run: ./target/release/always --version

      - name: Package
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          STAGING="always-${TAG}-${TARGET}"
          mkdir -p "$STAGING/bin" "$STAGING/share"
          install -m 755 target/release/always "$STAGING/bin/always"
          install -m 644 scripts/release/always-daemon.service "$STAGING/share/always-daemon.service"
          cp README.md LICENSE "$STAGING/"
          tar czf "$STAGING.tar.gz" "$STAGING"
          cargo deb --no-build --no-strip --output "$STAGING.deb"
          cargo generate-rpm --output "$STAGING.rpm"
          for f in "$STAGING.tar.gz" "$STAGING.deb" "$STAGING.rpm"; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -l always-*
          dpkg-deb --info "$STAGING.deb"
          dpkg-deb --contents "$STAGING.deb"
          rpm -qpl "$STAGING.rpm"
          tar tzvf "$STAGING.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: always-${{ matrix.target }}
          path: |
            always-*.tar.gz
            always-*.deb
            always-*.rpm
            always-*.sha256
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    # Windows is part of the required GUI release matrix; branch dry runs
    # must fail too when the GUI installer or daemon integration is broken.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-x86_64-pc-windows-msvc
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref_type == 'tag' }}

      - name: Build daemon (windows,cpal)
        run: cargo build --release --locked --no-default-features --features windows,cpal --target x86_64-pc-windows-msvc

      - name: Test generated Windows named-pipe ACL
        run: cargo test --locked --lib --no-default-features --features windows,cpal --target x86_64-pc-windows-msvc private_pipe_security_tests::generated_pipe_descriptor_allows_only_owner_and_system

      - name: Test bounded Windows peer-pipe transport
        run: cargo test --locked --lib --no-default-features --features windows,cpal --target x86_64-pc-windows-msvc peer_transport_windows::tests

      - name: Prepare bundled daemon for Always GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleDaemon = 'crates/always_tauri/bundle/daemon/always'
          New-Item -ItemType Directory -Force -Path (Split-Path $bundleDaemon) | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/always.exe' $bundleDaemon
          Copy-Item 'target/x86_64-pc-windows-msvc/release/always.exe' "$bundleDaemon.exe"
          & "$bundleDaemon.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'bundled daemon failed to run' }

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install GUI dependencies
        working-directory: always-gui
        run: bun install --frozen-lockfile

      - name: Build GUI frontend
        working-directory: always-gui
        run: bun run build

      - name: Build Always GUI installer
        working-directory: crates/always_tauri
        run: bun ../../always-gui/node_modules/@tauri-apps/cli/tauri.js build --bundles nsis

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          $staging = "always-$env:TAG-$target"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "target/$target/release/always.exe" $staging
          Copy-Item README.md, LICENSE $staging
          & "./$staging/always.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'always.exe failed to run' }
          $zip = "$staging.zip"
          Compress-Archive -Path $staging -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          # `<hash>  <name>`, the same shape as shasum/sha256sum.
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")
          $installers = @(Get-ChildItem 'crates/always_tauri/target/release/bundle/nsis' -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw "Expected one Tauri NSIS installer, found $($installers.Count)" }
          $guiInstaller = "always-$env:TAG-$target-gui-setup.exe"
          Copy-Item $installers[0].FullName $guiInstaller
          $guiHash = (Get-FileHash -Algorithm SHA256 $guiInstaller).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$guiInstaller.sha256", "$guiHash  $guiInstaller`n")
          Get-ChildItem always-* | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: always-x86_64-pc-windows-msvc
          path: |
            always-*.zip
            always-*.zip.sha256
            always-*-gui-setup.exe
            always-*-gui-setup.exe.sha256
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Collect and attest
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Provenance attestation: the OIDC token Sigstore exchanges for a
      # short-lived signing certificate naming this workflow, and the write
      # that stores the signed attestation on the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: always-*
          path: artifacts
          merge-multiple: true

      - name: Check the full asset set is present and checksummed
        run: |
          set -euo pipefail
          cd artifacts
          missing=0
          for f in \
            "always-${TAG}-aarch64-apple-darwin.tar.gz" \
            "always-${TAG}-x86_64-unknown-linux-gnu.tar.gz" \
            "always-${TAG}-x86_64-unknown-linux-gnu.deb" \
            "always-${TAG}-x86_64-unknown-linux-gnu.rpm" \
            "always-${TAG}-aarch64-unknown-linux-gnu.tar.gz" \
            "always-${TAG}-aarch64-unknown-linux-gnu.deb" \
            "always-${TAG}-aarch64-unknown-linux-gnu.rpm" \
            "always-${TAG}-x86_64-unknown-linux-gnu-gui.deb" \
            "always-${TAG}-x86_64-unknown-linux-gnu-gui.AppImage" \
            "always-${TAG}-aarch64-unknown-linux-gnu-gui.deb" \
            "always-${TAG}-aarch64-unknown-linux-gnu-gui.AppImage" \
            "always-${TAG}-x86_64-pc-windows-msvc-gui-setup.exe"; do
            for g in "$f" "$f.sha256"; do
              if [ ! -s "$g" ]; then echo "::error::missing asset $g"; missing=1; fi
            done
          done
          # The Windows CLI archive and GUI installer are required on every run.
          win="always-${TAG}-x86_64-pc-windows-msvc.zip"
          for g in "$win" "$win.sha256"; do
            if [ ! -s "$g" ]; then
              echo "::error::missing asset $g"; missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          sha256sum -c ./*.sha256
          ls -l

      # SLSA build provenance for what a user downloads and runs: every archive
      # and package, plus the two installers the README pipes into a shell. The
      # .sha256 files prove the download was not corrupted, never who built it;
      # an attestation is signed by this workflow on this ref and checked with
      # `gh attestation verify`. Before the hand-off on purpose: a signing
      # failure stops the release instead of publishing it unattested.
      - name: Attest build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/always-*.tar.gz
            artifacts/always-*.zip
            artifacts/always-*.AppImage
            artifacts/always-*-gui-setup.exe
            artifacts/always-*.deb
            artifacts/always-*.rpm
            scripts/release/install.sh
            scripts/release/install.ps1

      # The attestation also ships as a file (the Sigstore bundle, one JSON
      # line covering every subject), checkable offline with
      # `gh attestation verify --bundle`. *.intoto.jsonl is the suffix OpenSSF
      # Scorecard's Signed-Releases check reads as provenance.
      - name: Stage the release assets
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp artifacts/always-* scripts/release/install.sh scripts/release/install.ps1 release-assets/
          if [ ! -s "$BUNDLE" ]; then
            echo "::error::actions/attest left no bundle at '$BUNDLE'; the release would ship without its provenance file"
            exit 1
          fi
          cp "$BUNDLE" "release-assets/always-${TAG}.intoto.jsonl"
          ls -l release-assets

      # minisign comes from the Ubuntu archive (apt verifies the repository's
      # GPG signature): package `minisign` 0.11 in noble/universe, which has
      # everything used here (-S -s -m -x -t, -V -p -m -x).
      # https://packages.ubuntu.com/noble/minisign  https://jedisct1.github.io/minisign/
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      # The updater (`always update`, SPEC section 12a) installs nothing that is
      # not covered by a signature verifying against the public key compiled
      # into the app. So every archive, package and installer script gets a
      # .minisig here, and each is checked straight away against the key
      # committed in the repo: a secret that does not match
      # resources/update-signing.pub fails the build instead of shipping
      # signatures no app accepts.
      #
      # No secret (a fork, or a branch dry run without it): a dry run skips
      # signing with a notice; a tag run FAILS, because a release without
      # signatures cannot be updated to.
      #
      # An unencrypted key (minisign -G -W) needs no password; stdin is
      # /dev/null so minisign can never wait on a prompt.
      - name: Sign the release assets (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.ALWAYS_MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.ALWAYS_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::ALWAYS_MINISIGN_SECRET_KEY is not available; refusing to build a release without signatures"
              exit 1
            fi
            echo "::notice::DRY RUN without ALWAYS_MINISIGN_SECRET_KEY: minisign signing skipped, no .minisig files in this run"
            echo "### Signing skipped (no ALWAYS_MINISIGN_SECRET_KEY in this run)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          tab="$(printf '\t')"
          cd release-assets
          shopt -s nullglob
          count=0
          for f in always-*.tar.gz always-*.zip always-*.deb always-*.rpm always-*.AppImage always-*-gui-setup.exe install.sh install.ps1; do
            comment="timestamp:$(date +%s)${tab}file:${f}${tab}tag:${TAG}"
            if [ -n "$MINISIGN_PASSWORD" ]; then
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "$comment"
            else
              minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "$comment" < /dev/null
            fi
            minisign -V -p "$GITHUB_WORKSPACE/resources/update-signing.pub" -m "$f" -x "$f.minisig"
            count=$((count + 1))
          done
          [ "$count" -ge 2 ] || { echo "::error::signed only $count files"; exit 1; }
          echo "### Signed $count files with minisign (verified against resources/update-signing.pub)" >> "$GITHUB_STEP_SUMMARY"
          ls -l ./*.minisig

      - name: Upload the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
