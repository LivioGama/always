name: CI

# PR feedback must take under a minute (owner's decision, 2026-11-08), so this
# only checks formatting, which needs no compilation. Tests, builds and
# `cargo deny` run in release.yml, which gates every publish.
#
# `CI` is the required status check on `main`, matched by job name. Add no
# `paths:` filter: a skipped workflow leaves the check pending and blocks merging.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check formatting
        run: cargo fmt --all -- --check
