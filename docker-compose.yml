services:
  always:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: always-voice-daemon
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - ALWAYS_CONFIG_DIR=/app/data
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
    volumes:
      - always_data:/app/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    privileged: true
    command: ["always", "run"]
    healthcheck:
      test: ["CMD", "always", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  always_data:
    driver: local