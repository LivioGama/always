# Linux daemon-only deployment.
#
# Notes:
#   * Audio capture requires the host's `/dev/snd` device — that is the
#     ONLY mount the container needs.
#   * GUI overlay + global keyboard shortcuts are macOS-only; the Linux
#     image runs CLI-only. Toggle pause / auto-enter via:
#         docker exec always-voice-daemon always toggle pause
#   * `privileged: true` was previously set for X11; no longer needed
#     and removed to reduce blast radius.
#
# Configure GROQ_API_KEY in `.env` next to this file.

services:
  always:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: always-voice-daemon
    restart: unless-stopped
    environment:
      - RUST_LOG=info
      - ALWAYS_CONFIG_DIR=/home/always/.config/always
      - GROQ_API_KEY=${GROQ_API_KEY}
    # Audio device only — no X11, no privileged mode.
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - always_config:/home/always/.config/always
      - always_cache:/home/always/.cache/always
    # `host` networking keeps the UDS socket reachable from a host-side
    # CLI. Drop to `bridge` if you only run the daemon in-container.
    network_mode: host
    command: ["always", "run"]
    healthcheck:
      test: ["CMD", "always", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  always_config:
    driver: local
  always_cache:
    driver: local
